[project]
name = "lite-holdem-ai"
version = "0.6.0"
description = "A Python package for Lite Holdem poker agents, CFR training, and agent evaluation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Richard Dunbar" }
]
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
lite_holdem_ai = ["data/*.json", "data/*.pkl"]